<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>演化圖</title>
    <script src="/js/evolution_chart.js"></script>
    <script nomodule>
      // 不支持 ES Modules 的瀏覽器：說明原因，避免一直停在「正在思考……」
      document.addEventListener('DOMContentLoaded', function () {
      var msg = '您的瀏覽器版本過舊（不支持 WebAssembly / 新版 JavaScript），無法運行本站。'
      + '請改用最新版的 Chrome、Edge 或 Firefox（iPhone 請用 Safari）。';
      var s = document.getElementById('splash-status');
      if (s) { s.textContent = msg; }
      else if (document.body) { document.body.textContent = msg; }
      });
    </script>
    <link rel="preload" href="/evolution-web_bg.wasm?v=1.0.646" as="fetch" type="application/wasm" crossorigin="">
    <link rel="modulepreload" href="/evolution-web.js?v=1.0.646">
    <script type="module">
      import init from '/evolution-web.js?v=1.0.646';
      (async function startApp() {
      try {
      await init({ url: '/evolution-web_bg.wasm?v=1.0.646' });
      try { sessionStorage.removeItem('__assetReload'); } catch (e) { /* 忽略 */ }
      } catch (error) {
      console.error(error);
      try {
      if (!sessionStorage.getItem('__cacheReset')) {
      sessionStorage.setItem('__cacheReset', '1');
      if (window.caches && caches.keys) {
      const keys = await caches.keys();
      await Promise.all(keys.map(function (k) { return caches.delete(k); }));
      }
      if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(function (r) { return r.unregister(); }));
      }
      location.reload();
      return;
      }
      } catch (e) { /* 忽略 */ }
      const msg = String(error && error.message ? error.message : error);
      // JS 膠水與 wasm 版本不匹配時，自動刷新一次以取得一致的資源
      if (/LinkError|import object field/i.test(msg)) {
      try {
      if (!sessionStorage.getItem('__assetReload')) {
      sessionStorage.setItem('__assetReload', '1');
      location.reload();
      return;
      }
      } catch (e) { /* 忽略 */ }
      }
      document.body.textContent = '加載失敗：' + msg + '。請刷新頁面重試，或更換瀏覽器。';
      }
      })();
    </script>
    <base target="_parent">
    </head>
    <body>
    </body>
</html>
