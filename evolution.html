<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>演化圖</title>
    <style>
      /* 首屏載入提示：避免 wasm 下載／初始化期間出現白屏（與其他子站一致） */
      html, body { margin: 0; }
      #splash {
      position: fixed;
      inset: 0;
      background-color: var(--color-background, #ffffff);
      color: var(--color-text, #222222);
      padding-top: 4rem;
      transition: opacity 200ms ease, visibility 200ms;
      visibility: hidden;
      opacity: 0;
      z-index: 9999;
      }
      body.loading #splash { visibility: visible; opacity: 1; }
      #splash > * {
      width: 10rem;
      max-width: 480px;
      margin: 2rem auto;
      display: block;
      text-align: center;
      }
      body.loading > *:not(#splash) { visibility: hidden; }
    </style>
    <script src="/js/evolution_chart.js"></script>
    <script nomodule>
      // 不支持 ES Modules 的瀏覽器：說明原因，避免一直停在「正在思考……」
      document.addEventListener('DOMContentLoaded', function () {
      var msg = '您的瀏覽器版本過舊（不支持 WebAssembly / 新版 JavaScript），無法運行本站。'
      + '請改用最新版的 Chrome、Edge 或 Firefox（iPhone 請用 Safari）。';
      var s = document.getElementById('splash-status');
      if (s) { s.textContent = msg; }
      else if (document.body) { document.body.textContent = msg; }
      });
    </script>
    <link rel="preload" href="/evolution-web_bg.wasm?v=1.0.1079" as="fetch" type="application/wasm" crossorigin="">
    <link rel="modulepreload" href="/evolution-web.js?v=1.0.1079">
    <script type="module">
      import init from '/evolution-web.js?v=1.0.1079';
      async function startApp() {
      const statusEl = document.getElementById('splash-status');
      const progressEl = document.getElementById('splash-progress');
      const setStatus = (text) => { if (statusEl) statusEl.textContent = text; };
      try {
      if (typeof WebAssembly !== 'object') {
      throw new Error('此瀏覽器不支持 WebAssembly');
      }
      setStatus('正在下載程序……');
      const response = await fetch('/evolution-web_bg.wasm?v=1.0.1079', { credentials: 'omit' });
      if (!response.ok) {
      throw new Error('下載失敗（HTTP ' + response.status + '）');
      }
      let bytes;
      if (response.body && response.body.getReader) {
      const reader = response.body.getReader();
      const chunks = [];
      let received = 0;
      for (;;) {
      const step = await reader.read();
      if (step.done) break;
      chunks.push(step.value);
      received += step.value.length;
      setStatus('正在下載程序…… ' + (received / 1048576).toFixed(1) + ' MB');
      }
      bytes = new Uint8Array(received);
      let offset = 0;
      for (const chunk of chunks) { bytes.set(chunk, offset); offset += chunk.length; }
      } else {
      bytes = new Uint8Array(await response.arrayBuffer());
      }
      if (!WebAssembly.validate(bytes)) {
      throw new Error('此瀏覽器不支持本程序所需的 WebAssembly 特性，請升級瀏覽器（建議 Chrome 96 以上 / Safari 15 以上）');
      }
      setStatus('正在初始化……');
      await init({ module_or_path: bytes });
      try { sessionStorage.removeItem('__assetReload'); } catch (e) { /* 忽略 */ }
      // 通知外層首頁（iframe 宿主）收起「正在搬磚」：wasm 已就緒
      try {
      var notifyReady = function () {
      // 收起本頁首屏載入提示（wasm 已就緒、首幀已排程）
      try { if (window.__hideSplash) window.__hideSplash(); } catch (e) { /* 忽略 */ }
      if (window.parent && window.parent !== window) {
      window.parent.postMessage({ type: 'app-ready' }, '*');
      }
      };
      requestAnimationFrame(function () { requestAnimationFrame(notifyReady); });
      } catch (e) { /* 忽略 */ }
      } catch (error) {
      console.error(error);
      try {
      if (!sessionStorage.getItem('__cacheReset')) {
      sessionStorage.setItem('__cacheReset', '1');
      if (window.caches && caches.keys) {
      const keys = await caches.keys();
      await Promise.all(keys.map(function (k) { return caches.delete(k); }));
      }
      if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(function (r) { return r.unregister(); }));
      }
      location.reload();
      return;
      }
      } catch (e) { /* 忽略 */ }
      const msg = String(error && error.message ? error.message : error);
      // JS 膠水與 wasm 版本不匹配時，自動刷新一次以取得一致的資源
      if (/LinkError|import object field/i.test(msg)) {
      try {
      if (!sessionStorage.getItem('__assetReload')) {
      sessionStorage.setItem('__assetReload', '1');
      location.reload();
      return;
      }
      } catch (e) { /* 忽略 */ }
      }
      if (progressEl) progressEl.remove();
      setStatus('加載失敗：' + msg + '。請刷新頁面重試，或更換瀏覽器。');
      }
      }
      startApp();
    </script>
    <base target="_parent">
    </head>
    <body class="loading">
      <div id="splash">
        <div>演化圖<br>正在思考……</div>
        <progress id="splash-progress"></progress>
        <div id="splash-status" style="width: 20rem; font-size: 0.8rem; line-height: 1.5;"></div>
      </div>
      <script>
        // wasm 就緒且首幀繪製後，收起首屏載入提示
        (function () {
        var hide = function () {
        try { document.body.classList.remove('loading'); } catch (e) { /* 忽略 */ }
        try {
        var s = document.getElementById('splash');
        if (s) { s.style.visibility = 'hidden'; s.style.opacity = '0'; }
        } catch (e) { /* 忽略 */ }
        };
        window.__hideSplash = hide;
        })();
      </script>
    </body>
</html>
