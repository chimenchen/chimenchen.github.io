<!DOCTYPE html>
  <html lang="zh">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>口口聲聲（多方言）</title>
      <link rel="stylesheet" href="/duyin.css">
      <script src="/js/espeakng.js"></script>
      <script src="/js/zhongwen_speak.js"></script>
      <link rel="preload" href="/duyinzdic-web_bg.wasm?v=1.0.614" as="fetch" type="application/wasm" crossorigin="">
      <link rel="modulepreload" href="/duyinzdic-web.js?v=1.0.614">
      <script type="module">
        import init from '/duyinzdic-web.js?v=1.0.614';
        // 下載並啟動 wasm：顯示下載進度；失敗時給出明確提示。
        // 舊版瀏覽器可能不支持本程序所需的 WebAssembly 特性，否則會一直停留在「正在思考……」。
        async function startApp() {
        const statusEl = document.getElementById('splash-status');
        const progressEl = document.getElementById('splash-progress');
        const setStatus = (text) => {
        if (statusEl) statusEl.textContent = text;
        };
        try {
        if (typeof WebAssembly !== 'object') {
        throw new Error('此瀏覽器不支持 WebAssembly');
        }
        setStatus('正在下載程序……');
        const response = await fetch('/duyinzdic-web_bg.wasm?v=1.0.614', { credentials: 'omit' });
        if (!response.ok) {
        throw new Error('下載失敗（HTTP ' + response.status + '）');
        }
        let bytes;
        if (response.body && response.body.getReader) {
        const reader = response.body.getReader();
        const chunks = [];
        let received = 0;
        for (;;) {
        const step = await reader.read();
        if (step.done) break;
        chunks.push(step.value);
        received += step.value.length;
        setStatus('正在下載程序…… ' + (received / 1048576).toFixed(1) + ' MB');
        }
        bytes = new Uint8Array(received);
        let offset = 0;
        for (const chunk of chunks) {
        bytes.set(chunk, offset);
        offset += chunk.length;
        }
        } else {
        bytes = new Uint8Array(await response.arrayBuffer());
        }
        if (!WebAssembly.validate(bytes)) {
        throw new Error('此瀏覽器不支持本程序所需的 WebAssembly 特性，請升級瀏覽器（建議 Chrome 96 以上 / Safari 15 以上）');
        }
        setStatus('正在初始化……');
        await init({ module_or_path: bytes });
        try { sessionStorage.removeItem('__assetReload'); } catch (e) { /* 忽略 */ }
        } catch (error) {
        console.error(error);
        // 若 JS 膠水與 wasm 版本不匹配（LinkError），自動刷新一次以取得一致的資源
        const msg = String(error && error.message ? error.message : error);
        if (/LinkError|import object field/i.test(msg)) {
        try {
        if (!sessionStorage.getItem('__assetReload')) {
        sessionStorage.setItem('__assetReload', '1');
        location.reload();
        return;
        }
        } catch (e) { /* 忽略 */ }
        }
        if (progressEl) progressEl.remove();
        setStatus('加載失敗：' + (error && error.message ? error.message : error) + '。請刷新頁面重試，或更換瀏覽器。');
        }
        }
        startApp();
      </script>
      <base target="_parent">
      </head>
      <body class="loading">
        <div id="splash">
          <div>多方言<br>口口聲聲系統<br>正在思考……</div>
          <progress id="splash-progress"></progress>
          <div id="splash-status" style="width: 20rem; font-size: 0.8rem; line-height: 1.5;"></div>
        </div>
      </body>
</html>
